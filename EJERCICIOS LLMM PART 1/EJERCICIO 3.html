<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EJERCICIO 3</title>
    <link rel="stylesheet" href="CSS/ESTILOS EJ3.css">
</head>

<body>

    <h2 class="titulo-tabla">Tabla prueba 1</h2>

    <table class="tabla tabla-azul">
        <thead>
            <tr>
                <th class="columna">columna 1</th>
                <th class="columna">columna 2</th>
                <th class="columna">columna 3</th>
                <th class="columna">columna 4</th>
            </tr>

        </thead>

        <tbody class="cuerpo">

            <tr>
                <td class="celda">col1</td>
                <td class="celda" colspan="2">col2</td>
                <td class="celda" rowspan="2">col3</td>
            </tr>
            <tr>
                <td class="celda">colum1</td>
                <td class="celda">colum2</td>
                <td class="celda">colum4</td>
            </tr>

        </tbody>

    </table>

    <h2 class="titulo-tabla titulo-tabla-2">Tabla prueba 2</h2>

    <table class="tabla tabla-verde">
        <thead>
            <tr>
                <th>columna 1</th>
                <th>columna 2</th>
                <th>columna 3</th>
                <th>columna 4</th>
            </tr>
        </thead>
        <tbody>
            <tr class="fila-verde">
                <td>col1</td>
                <td colspan="2">col2</td>
                <td>col3</td>
            </tr>
            <tr>
                <td>colum1</td>
                <td rowspan="2">colum2</td>
                <td>colum3</td>
                <td>colum4</td>
            </tr>
            <tr class="fila-verde">
                <td>column1</td>
                <td>column3</td>
                <td>column4</td>
            </tr>
            <tr>
                <td>colu1</td>
                <td>colu2</td>
                <td>colu3</td>
                <td>colu4</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
